[project]
name = "tally-bridge"
version = "1.0.0"
description = "Sends TallyPrime data (read-only) to the AI Business Analyst Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "defusedxml>=0.7.1",
]

[project.scripts]
tally-bridge = "tally_bridge.cli:main"

[dependency-groups]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally_bridge"]
exclude = ["tally_bridge/dev"]

# Tests, ruff and mypy run from backend/ (same Python, same httpx/defusedxml): make test-backend, lint, typecheck.
