  # --- 4. Discounting and margin -------------------------------------------------------------------------------
  - id: heaviest_discount
    ask: "Which category has the heaviest discounting?"
    lens: finance
    finding: 4
    plan:
      - tool: run_sql
        args: {sql: "SELECT product_type, ROUND(100 * SUM(total_discounts) / SUM(total_line_items_price), 1) AS avg_discount_pct FROM shopify_orders GROUP BY 1 ORDER BY 2 DESC"}
    expect:
      numbers: [{label: Fashion discount, value: 23.1, tolerance: 0.3, unit: pct}]
      names: [[Fashion]]

  - id: thinnest_margin
    ask: "Which category has the thinnest gross margin?"
    lens: finance
    finding: 4
    plan:
      - tool: run_sql
        args: {sql: "SELECT o.product_type, ROUND(100 * (SUM(o.total_price) - SUM(o.quantity * p.cost_per_item)) / SUM(o.total_price), 1) AS gross_margin_pct FROM shopify_orders o JOIN shopify_products p ON o.product_id = p.id GROUP BY 1 ORDER BY 2"}
    expect:
      numbers: [{label: Electronics margin, value: 21.5, tolerance: 0.3, unit: pct}]
      names: [[Electronics]]

  - id: festive_discounts
    ask: "How much more discount did we give in October and November 2025 than in the two months before?"
    lens: finance
    finding: 4
    plan:
      - tool: kpi_summary
        args: {metrics: [revenue, discounts], period: {start: "2025-10-01", end: "2025-11-30"}, compare: {start: "2025-08-01", end: "2025-09-30"}}
    expect:
      numbers: [{label: discount change, value: 130.3, tolerance: 0.5, unit: pct}]

  - id: hi_discount
    language: hi
    ask: "किस श्रेणी में सबसे ज़्यादा छूट दी जाती है?"
    lens: finance
