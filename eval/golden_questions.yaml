# Golden questions about the UrbanCart demo company (BUILD_SPEC 12.2, X4). Run by eval/harness.py:
#   - make test: a stand-in model replays each `plan` (no AI); checks the harness and the tool layer.
#   - make eval: a real model answers on its own (opt-in, uses the key in .env); report in eval/reports/.
#
# expect:
#   numbers: figures a correct answer states. value as in ANSWER_KEY.md; tolerance (absolute) or relative.
#            Signs are not compared ("fell 17.7%" and "-17.7%" both count). unit (pct, x, inr) only shapes how the
#            stand-in model writes it.
#   names:   groups of words; each group needs one of its words in the answer (case does not matter).
#   pct_between: [low, high] a percentage change in this range must be stated (what-ifs).
# finding: the planted finding of ANSWER_KEY.md the question checks (none = an everyday question).
# The five what-ifs come from whatif_scenarios.yaml (`scenario:`); they also need a range and assumptions.
# Hindi and Kannada questions are scored on facts; answers are in English for now (DECISIONS D41).

questions:
  # --- 1. South falls in Q3 2026 -------------------------------------------------------------------------------
  - id: south_q3_why
    ask: "Why did South revenue fall in Q3 2026 compared with Q2?"
    finding: 1
    plan:
      - tool: driver_analysis
        args: {metric: revenue, period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}, dimensions: [shipping_region]}
    expect:
      numbers: [{label: South change, value: -17.7, tolerance: 0.5, unit: pct}]
      names: [[South], [repeat, existing, returning]]

  - id: regions_q3
    ask: "How did each region do in Q3 2026 against Q2?"
    finding: 1
    plan:
      - tool: driver_analysis
        args: {metric: revenue, period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}, dimensions: [shipping_region]}
    expect:
      numbers:
        - {label: South, value: -17.7, tolerance: 0.5, unit: pct}
        - {label: West, value: 18.5, tolerance: 0.5, unit: pct}
        - {label: East, value: 17.0, tolerance: 0.5, unit: pct}
        - {label: North, value: 10.1, tolerance: 0.5, unit: pct}
      names: [[South]]

  - id: south_q3_revenue
    ask: "What was South revenue in Q3 2026?"
    finding: 1
    plan:
      - tool: kpi_summary
        args: {metrics: [revenue], period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}, filters: {shipping_region: South}}
    expect:
      numbers: [{label: South Q3 revenue, value: 2801265, relative: 0.01, unit: inr}]

  - id: south_electronics_price
    ask: "Did Electronics prices change in the South in July 2026?"
    finding: 1
    plan:
      - tool: run_sql
        args:
          sql: "SELECT ROUND(AVG(CASE WHEN o.created_at >= '2026-07-01' THEN o.unit_price / p.price END), 2) AS price_ratio_after, ROUND(AVG(CASE WHEN o.created_at < '2026-07-01' THEN o.unit_price / p.price END), 2) AS price_ratio_before FROM shopify_orders o JOIN shopify_products p ON o.product_id = p.id WHERE o.product_type = 'Electronics' AND o.shipping_region = 'South' AND o.created_at >= '2026-04-01'"
    expect:
      numbers: [{label: price ratio after, value: 1.12, tolerance: 0.01}]

  - id: south_categories
    ask: "Which categories fell in the South in Q3 2026?"
    finding: 1
    plan:
      - tool: driver_analysis
        args: {metric: revenue, period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}, dimensions: [product_type], filters: {shipping_region: South}}
    expect:
      numbers: [{label: South change, value: -17.7, tolerance: 0.5, unit: pct}]
      names: [[Electronics], [Sports, Fashion]]

  - id: hi_south
    language: hi
    ask: "दक्षिण में Q3 2026 में बिक्री क्यों घटी?"
    finding: 1
    plan:
      - tool: driver_analysis
        args: {metric: revenue, period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}, dimensions: [shipping_region]}
    expect:
      numbers: [{label: South change, value: -17.7, tolerance: 0.5, unit: pct}]
      names: [[South, दक्षिण]]

  - id: kn_south
    language: kn
    ask: "ದಕ್ಷಿಣದಲ್ಲಿ Q3 2026 ರಲ್ಲಿ ಮಾರಾಟ ಏಕೆ ಕುಸಿಯಿತು?"
    finding: 1
    plan:
      - tool: driver_analysis
        args: {metric: revenue, period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}, dimensions: [shipping_region]}
    expect:
      numbers: [{label: South change, value: -17.7, tolerance: 0.5, unit: pct}]
      names: [[South, ದಕ್ಷಿಣ]]

