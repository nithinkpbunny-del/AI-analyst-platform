  # --- 7. Data gap ---------------------------------------------------------------------------------------------
  - id: website_gap
    ask: "How many Website orders did we get in the week of 9 March 2026?"
    finding: 7
    plan:
      - tool: kpi_summary
        args: {metrics: [orders], period: {start: "2026-03-09", end: "2026-03-15"}, compare: previous_period, filters: {sales_channel: Website}}
    expect:
      numbers:
        - {label: the week before, value: 94, tolerance: 1}
        - {label: change, value: -100, tolerance: 0.5, unit: pct}

  # --- 8. Targets ----------------------------------------------------------------------------------------------
  - id: targets_q3
    ask: "Which regions missed their revenue target in Q3 2026?"
    finding: 8
    plan:
      - tool: run_sql
        args:
          sql: "WITH t AS (SELECT region, SUM(revenue_target_inr) AS target FROM targets WHERE month >= '2026-07-01' AND month < '2026-10-01' GROUP BY 1), a AS (SELECT shipping_region AS region, SUM(total_price) - SUM(total_refunds) AS actual FROM shopify_orders WHERE created_at >= '2026-07-01' AND created_at < '2026-10-01' GROUP BY 1) SELECT t.region, t.target, a.actual, ROUND(100 * (a.actual / t.target - 1), 1) AS vs_target_pct FROM t JOIN a USING (region) ORDER BY 4"
    expect:
      numbers: [{label: South vs target, value: -25.5, tolerance: 0.3, unit: pct}]
      names: [[South]]

  - id: south_target_gap
    ask: "How far is the South from its Q3 2026 revenue target, in rupees?"
    finding: 8
    plan:
      - tool: run_sql
        args:
          sql: "WITH t AS (SELECT SUM(revenue_target_inr) AS target FROM targets WHERE region = 'South' AND month >= '2026-07-01' AND month < '2026-10-01'), a AS (SELECT SUM(total_price) - SUM(total_refunds) AS actual FROM shopify_orders WHERE shipping_region = 'South' AND created_at >= '2026-07-01' AND created_at < '2026-10-01') SELECT t.target, a.actual, t.target - a.actual AS gap FROM t, a"
    expect:
      numbers:
        - {label: target, value: 3759000, relative: 0.01, unit: inr}
        - {label: gap, value: 957735, relative: 0.02, unit: inr}

  # --- Everyday questions --------------------------------------------------------------------------------------
  - id: q3_kpis
    ask: "How did revenue, orders and average order value change in Q3 2026 against Q2?"
    plan:
      - tool: kpi_summary
        args: {metrics: [revenue, orders, aov], period: {start: "2026-07-01", end: "2026-09-30"}, compare: {start: "2026-04-01", end: "2026-06-30"}}
    expect:
      numbers:
        - {label: revenue change, value: 5.5, tolerance: 0.1, unit: pct}
        - {label: orders change, value: 9.5, tolerance: 0.1, unit: pct}
        - {label: AOV change, value: -3.6, tolerance: 0.1, unit: pct}

  - id: september_orders
    ask: "How many orders did we get in September 2026, and how does that compare with August?"
    plan:
      - tool: kpi_summary
        args: {metrics: [orders], period: {start: "2026-09-01", end: "2026-09-30"}, compare: previous_period}
    expect:
      numbers:
        - {label: September orders, value: 1701, tolerance: 0}
        - {label: change, value: 3.5, tolerance: 0.1, unit: pct}

  - id: revenue_trend_2026
    ask: "Show me monthly revenue for 2026 so far. Which month was best?"
    plan:
      - tool: trend
        args: {metric: revenue, period: {start: "2026-01-01", end: "2026-09-30"}, grain: month}
    expect:
      numbers: [{label: August revenue, value: 4468291, relative: 0.01, unit: inr}]
      names: [[August, Aug, "2026-08"]]

  - id: ytd_vs_last_year
    ask: "How is revenue this year so far compared with the same months last year?"
    plan:
      - tool: kpi_summary
        args: {metrics: [revenue], period: {start: "2026-01-01", end: "2026-09-30"}, compare: previous_year}
    expect:
      numbers: [{label: growth, value: 23.9, tolerance: 0.2, unit: pct}]

  - id: top_category
    ask: "Which product category brings in the most revenue?"
    plan:
      - tool: run_sql
        args: {sql: "SELECT product_type, ROUND(SUM(total_price) - SUM(total_refunds), 0) AS revenue FROM shopify_orders GROUP BY 1 ORDER BY 2 DESC"}
    expect:
      numbers: [{label: Electronics revenue, value: 30224171, relative: 0.01, unit: inr}]
      names: [[Electronics]]

  - id: channel_mix
    ask: "What share of our orders come through the app?"
    plan:
      - tool: run_sql
        args: {sql: "SELECT sales_channel, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS share_pct FROM shopify_orders GROUP BY 1 ORDER BY 2 DESC"}
    expect:
      numbers: [{label: App share, value: 50.3, tolerance: 0.3, unit: pct}]
      names: [[App]]

  - id: customers_by_region
    ask: "Where are our customers? Give the share by region."
    plan:
      - tool: run_sql
        args: {sql: "SELECT region, COUNT(*) AS customers, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS share_pct FROM shopify_customers GROUP BY 1 ORDER BY 2 DESC"}
    expect:
      numbers:
        - {label: South share, value: 30.0, tolerance: 0.3, unit: pct}
        - {label: East share, value: 18.0, tolerance: 0.3, unit: pct}
      names: [[South]]

  - id: small_business_customers
    ask: "Do small business customers order more often than consumers?"
    plan:
      - tool: run_sql
        args: {sql: "SELECT segment, COUNT(*) AS customers, ROUND(AVG(orders_count), 2) AS avg_orders FROM shopify_customers GROUP BY 1"}
    expect:
      numbers:
        - {label: Small Business orders, value: 14.55, tolerance: 0.05}
        - {label: Consumer orders, value: 8.62, tolerance: 0.05}

