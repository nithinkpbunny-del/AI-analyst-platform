[project]
name = "analyst-backend"
version = "0.1.0"
description = "AI Business Analyst Platform - backend API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "boto3>=1.34",
    # Used by the fixture generator now and by the analytics library later.
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-redis",
    "types-openpyxl",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # asserts are fine in tests; production code does not rely on them
    "E501",  # line length is handled by the formatter; long strings/comments are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"../eval/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: slower tests (fixture generation)",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "../eval"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no type information, so its decorators are untyped.
module = ["app.tasks.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# pandas/numpy-heavy scripts: the stubs return Any in many places; the code is checked by its tests instead.
module = ["generate_fixtures", "answer_key"]
warn_return_any = false
