[project]
name = "analyst-backend"
version = "0.1.0"
description = "AI Business Analyst Platform - backend API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "boto3>=1.34",
    # Used by the fixture generator now and by the analytics library later.
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "jinja2>=3.1",
    "email-validator>=2.2",
    "authlib>=1.9.5",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "cryptography>=50.0.2",
    "httpx>=0.27",
    "google-genai>=3.0.0",
    "anthropic>=2.6.0",
    "pyarrow>=18",
    "python-multipart>=0.0.20",
    "defusedxml>=0.7.1",
    "duckdb>=2.0.0",
    "pyyaml>=6",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "sqlglot>=26",
    "weasyprint>=63",
    "graphql-core>=3.3.2",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-redis",
    "types-openpyxl",
    "testcontainers[postgres]>=4.8",
    "fakeredis>=2.26",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # asserts are fine in tests; production code does not rely on them
    "E501",  # line length is handled by the formatter; long strings/comments are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"../bridge/tally/bridge_tests/**" = ["S105", "S106", "S311"]
"../eval/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests", "../bridge/tally/bridge_tests"]
# The Tally bridge (bridge/tally) is tested, linted and type-checked here too (same Python, httpx, defusedxml).
pythonpath = [".", "../bridge/tally"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: slower tests (fixture generation)",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "loadtest", "ops", "../eval", "../bridge/tally/tally_bridge", "../bridge/tally/bridge_tests"]
mypy_path = [".", "../eval", "../bridge/tally"]
explicit_package_bases = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "kombu.*", "testcontainers.*", "authlib.*", "pymysql.*", "defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no type information, so its decorators are untyped.
module = ["app.tasks.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# statsmodels, scipy and WeasyPrint ship no type information.
module = ["statsmodels.*", "scipy.*", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pandas/numpy-heavy scripts: the stubs return Any in many places; the code is checked by its tests instead.
module = ["generate_fixtures", "answer_key", "app.connectors.tabular", "app.data.quality", "app.analytics.*"]
warn_return_any = false
