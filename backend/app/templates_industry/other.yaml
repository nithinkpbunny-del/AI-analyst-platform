key: other
name: Something else
business: small or medium
summary: A general starting point for any other kind of business. The assistant works from your own data and dictionary.
words: "the words your data uses."
kpis:
  - {key: revenue, label: Revenue, meaning: "Sales value after discounts and refunds.", unit: INR, good_direction: up}
  - {key: orders, label: Orders, meaning: "Number of sales or jobs.", unit: count, good_direction: up}
  - {key: aov, label: Average order value, meaning: "Revenue divided by orders.", unit: INR, good_direction: up}
starter_questions:
  - How did revenue change last quarter, and why?
  - Were there any unusual days last month?
  - What can you tell me about my data?
elasticities:
